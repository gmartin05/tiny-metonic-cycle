[project]
name = "tiny-metonic-cycle"
version = "0.1.0"
description = "Calculates the paschal full moon using the 19-year Metonic cycle to determine dates for movable feasts."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
